name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: themis/test/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix themis/test

      - name: Test Themis and training timer
        run: npm test --prefix themis/test

      - name: Check content and versions
        run: |
          python3 scripts/sync-versions.py --check
          python3 scripts/check-content.py

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Render Quarto site
        run: quarto render

      # `training/` is a separate Quarto project with its own navbar and
      # footer, so it cannot be folded into the parent render. It is built
      # on its own and copied into the parent output, which puts it at
      # /fmup-ia/training/ on the deployed site.
      - name: Render training site
        run: quarto render
        working-directory: training

      - name: Merge training site into output
        run: |
          rm -rf _site/training
          cp -R training/_site _site/training

      - name: Check rendered internal links
        run: python3 scripts/audit-links.py

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FMUP_IA_DEPLOY_KEY }}" > ~/.ssh/fmup_ia_deploy
          chmod 600 ~/.ssh/fmup_ia_deploy
          ssh-keyscan -H 31.97.197.61 >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/fmup_ia_deploy" \
            ./_site/ tiagojct@31.97.197.61:/opt/vps/caddy/srv/fmup-ia/
